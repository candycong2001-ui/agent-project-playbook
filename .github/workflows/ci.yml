name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "check"
      - name: Ruff format
        run: ruff format --check .
      - name: Lint English templates
        run: python3 templates/skills/project-docs/scripts/docs_lint.py --project-root templates --language en
      - name: Lint Chinese templates
        run: python3 templates/skills/project-docs/scripts/docs_lint.py --project-root templates/zh-CN --language zh-CN
      - name: Scan tracked public files
        run: python3 scripts/scan_public_repo.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
